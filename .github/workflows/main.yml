name: Build Android APK (The English Master Key)

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Auto-Extract Project ZIP (If Uploaded Directly from Mobile)
        run: |
          if [ ! -f "app/build.gradle" ]; then
            for z in *.zip; do
              if [ -f "$z" ]; then
                echo "Found $z — extracting Android project files..."
                unzip -o "$z"
              fi
            done
          fi

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Build Debug & Release APK
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: 6. Sign Release APK for Direct Phone Installation
        run: |
          keytool -genkeypair -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias masterkey -storepass 123456 -keypass 123456 -dname "CN=Fahim Miya, OU=EnglishMasterKey, O=MasterKey, L=Dhaka, S=Dhaka, C=BD"
          ANDROID_BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $ANDROID_BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk EnglishMasterKey-Release-Aligned.apk
          $ANDROID_BUILD_TOOLS/apksigner sign --ks release-key.jks --ks-pass pass:123456 --key-pass pass:123456 --out EnglishMasterKey-Signed.apk EnglishMasterKey-Release-Aligned.apk
          cp app/build/outputs/apk/debug/app-debug.apk EnglishMasterKey-Debug.apk

      - name: 7. Upload Installable APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: English-Master-Key-APK
          path: |
            EnglishMasterKey-Signed.apk
            EnglishMasterKey-Debug.apk
